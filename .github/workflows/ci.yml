name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-policy:
    name: dependency-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check licenses, advisories, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Check all targets at MSRV
        run: cargo check --locked --all-targets

  platform-tests:
    name: platform-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Run native tests
        run: cargo test --locked --all-targets

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - name: Check repository policy
        run: sh scripts/repository-policy.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Build release binaries
        run: cargo build --release --locked --bins
      - name: Smoke-test binary contracts
        run: |
          target/release/banna --help
          target/release/banna-cli --help
      - name: Verify publishable crate
        run: cargo package --locked
