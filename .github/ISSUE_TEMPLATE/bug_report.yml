name: Bug report
description: Report a reproducible defect in Banna
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not report security vulnerabilities here; follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Banna version
      description: Release version or commit SHA.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Rust version, ABP version, and selected UI target.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal commands, field definition, and project shape needed to reproduce the issue. Remove secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: This report contains no credentials or private source code.
          required: true

