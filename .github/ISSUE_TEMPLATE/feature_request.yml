name: Feature request
description: Propose a focused product or developer-experience improvement
title: "proposal: "
labels: ["proposal", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable behavior would solve the problem?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Shared generation
        - Razor Pages
        - Vue
        - Angular
        - React Native
        - TUI
        - Headless CLI
        - Documentation or tooling
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility
      description: Note workarounds and any generated-output compatibility concerns.

