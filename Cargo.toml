[package]
name = "banna"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
default-run = "banna"
authors = ["Furkan Cemal Caliskan"]
description = "A terminal-based code generator for ABP applications"
readme = "README.md"
homepage = "https://github.com/furkancemalcaliskan/banna"
repository = "https://github.com/furkancemalcaliskan/banna"
license = "Apache-2.0 AND LGPL-3.0-only"
keywords = ["abp", "code-generation", "dotnet", "tui"]
categories = ["command-line-utilities", "development-tools"]

[lints.clippy]
# Generator source intentionally uses named aliases in large template format
# strings; keeping those names explicit makes template review less error-prone.
uninlined_format_args = "allow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
once_cell = "1.21"
path-absolutize = "4.0"
itertools = "0.15"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
crossterm = "0.29"
ratatui = "0.30.2"
rust-embed = "8"
mime_guess = "2"
tempfile = "3"
flate2 = "1.1"
fs2 = "0.4"
sha2 = "0.11"
tar = "0.4"
ureq = "3.4"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
